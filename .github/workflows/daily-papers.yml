name: Daily Recommendation Papers Digest

on:
  schedule:
    # 北京时间每天 7:00 (UTC 23:00前一天)，预留排队延迟约9点前到达
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no push, no feishu)'
        required: true
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      date_override:
        description: 'Override date (YYYY-MM-DD)'
        required: false
        default: ''
        type: string

env:
  PYTHON_VERSION: '3.12'

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt --quiet

      - name: Run pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          FEISHU_BITABLE_APP_TOKEN: ${{ secrets.FEISHU_BITABLE_APP_TOKEN }}
          FEISHU_BITABLE_URL: ${{ secrets.FEISHU_BITABLE_URL }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          DATE_OVERRIDE: ${{ github.event.inputs.date_override || '' }}
        run: |
          cd src
          if [ "$DRY_RUN" = "true" ]; then
            DRY_FLAG="--dry-run"
          else
            DRY_FLAG=""
          fi
          python main.py \
            ${DATE_OVERRIDE:+--date "$DATE_OVERRIDE"} \
            $DRY_FLAG

      - name: Commit and push
        if: github.event.inputs.dry_run != 'true'
        run: |
          git config user.name "recsys-bot"
          git config user.email "bot@recsys-daily.example.com"
          for d in papers data docs; do [ -d "$d" ] && git add "$d/" 2>/dev/null || true; done
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "docs: daily papers digest $(date +%Y-%m-%d)"
            git push
          fi
